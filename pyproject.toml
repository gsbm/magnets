[project]
name = "magnets"
version = "0.0.1"
description = "Geometric relationship snapping for Blender"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Default run is the fast, bpy-free unit suite. Integration tests (headless
# Blender) are opt-in: `pytest tests/integration -m integration`.
testpaths = ["tests/unit"]
markers = [
    "integration: requires a Blender binary (BLENDER_BIN or on PATH)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting
