[project]
name = "magnets"
version = "0.0.1"
description = "Geometric relationship snapping for Blender"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Default run is the fast, bpy-free unit suite. Integration tests (headless
# Blender) are opt-in: `pytest tests/integration -m integration`.
testpaths = ["tests/unit"]
markers = [
    "integration: requires a Blender binary (BLENDER_BIN or on PATH)",
    "live: windowed Blender with simulated input (MAGNETS_LIVE=1, needs a display)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting
# Blender classes declare `bl_options = {...}` as class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Locale modules are named after Blender language codes (fr_FR); msgid keys are
# long English strings split across lines inside the (context, msgid) tuple.
"magnets/translations/*" = ["N999", "ISC004"]
