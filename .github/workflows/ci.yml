name: CI

on:
  push:
  pull_request:
  # Nightly run of the windowed live suite (see the `live` job); also manual.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Build extension zip
        run: python build/build_zip.py

  blender:
    name: Blender headless suite
    runs-on: ubuntu-latest
    # Unit tests import mathutils, which has no reliable pip wheel, so they run
    # inside Blender's bundled Python. Bump these two to move to a newer patch.
    # Pinned so the run is reproducible; 4.2 is the minimum the manifest targets.
    env:
      BLENDER_SERIES: "4.2"
      BLENDER_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          curl -fSL "$url" -o blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1

      - name: Add Blender to PATH
        run: echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: In-Blender unit suite (bundled mathutils/numpy)
        run: |
          set -o pipefail
          blender --background --factory-startup \
            --python tests/run_unit_in_blender.py 2>&1 | tee blender-unit.log
          grep -qE '[0-9]+ passed, 0 failed' blender-unit.log

      - name: Headless integration tests
        # Blender is on PATH (previous step), so the tests find it via
        # shutil.which("blender") - no BLENDER_BIN needed.
        run: pytest tests/integration -m integration -q

  live:
    name: Live windowed suite (virtual display)
    # Real native transforms driven by simulated mouse events in a windowed
    # Blender on Xvfb with software OpenGL. Slower and timing-sensitive, so it
    # runs nightly and on demand, and a failure does not fail the workflow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    env:
      BLENDER_SERIES: "4.2"
      BLENDER_VERSION: "4.2.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fSL "$url" -o blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1

      - name: Add Blender to PATH
        run: echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libxkbcommon-x11-0 libsm6

      - name: Live tests
        env:
          MAGNETS_LIVE: "1"
          # Mesa's llvmpipe; stretch the scripted timings for the slow renderer.
          LIBGL_ALWAYS_SOFTWARE: "1"
          MAGNETS_LIVE_TIME_SCALE: "3"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest tests/live -m live -q -rA
